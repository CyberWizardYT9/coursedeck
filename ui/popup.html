<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Coursedeck</title>
<link rel="stylesheet" href="app.css">
</head>
<body class="popup-page">
<div class="popup-wrap">
  <header class="popup-header"><div class="row"><img src="../icons/128.png" alt="" width="30" height="30"><b>Coursedeck</b></div><button class="btn ghost icon-btn" id="sync" aria-label="Refresh Canvas" title="Refresh Canvas"><span data-icon="refresh"></span></button></header>
  <p class="popup-eyebrow">A LITTLE CLARITY, AT A GLANCE</p>
  <h1>What’s next?</h1>
  <div id="body" aria-live="polite"><p class="sub">Gathering your coursework…</p></div>
  <button class="btn primary popup-open" id="open">Open your workspace <span data-icon="arrow"></span></button>
  <p class="popup-shortcut">Your full school day, in one place. <kbd>Alt ⇧ C</kbd></p>
</div>
<script type="module" src="popup.js"></script>
</body>
</html>
